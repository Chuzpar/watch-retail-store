<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickr</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    
    <div class="top-bar">
        <div class="top-left">
            <button>Shop All Products</button>
        </div>
        
        <div class="top-right">
        <h4>Enjoy our great international shipping rates</h4>   
        <h4>Over 1,000 satisfied customers since 1987</h4>
        </div>
      </div>
    <header class="navbar">
        <h2 class="logo">Tickr</h2>
        <nav>
           <a href="#">Men Watches</a>
           <a href="#">Women Watches</a>
           <a href="#">Sale</a>
        </nav>
    </header>
     <div class="hero">
        <img src="/assets/laurenz-heymann-al6s6JpnZis-unsplash.jpg" alt="Product-Image">
        <div class="hero-text">
           <h1>Discover Timeless Elegance</h1>
           <button>Shop Now</button>
        </div>
     </div>

     <section class="products">
        <div class="card">
            <img src="/assets/fossil watch.jpg" alt="Fossil Watch">
            <h3>Fossil Men's Decker Analog Quartz Watch</h3>
            <p>$65.00</p>
        </div>
        
        <div class="card">
            <img src="/assets/hakim-rahman-P9nOs2Jgpl0-unsplash.jpg" alt="Alexandre Christie Watch">
            <h3>Alexandre Christie Simple Life</h3>
            <p>$199.00</p>
        </div>
     </section>
</body>
</html>
